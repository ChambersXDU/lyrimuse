name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 测试
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Localizable.strings 一致性
        run: python3 lyrimuse/scripts/check_strings_parity.py

      - name: 第三方许可声明覆盖
        run: python3 lyrimuse/scripts/check_third_party_licenses.py

      - name: Swift selftest
        run: |
          cd lyrimuse
          swift build --product lyrimuse-selftest
          ./.build/debug/lyrimuse-selftest

      - name: 编译整个 App
        run: cd lyrimuse && swift build
